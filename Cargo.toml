[package]
name = "capslock_off"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "CapsLock-Taste systemweit (User-Session) deaktivieren oder als LeftShift umbelegen. Native Windows-App mit Tray-Icon und WM_USER IPC."
authors = ["nopnop9090"]
license = "MIT"
repository = "https://github.com/nopnop9090/capslock_off_rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_Security",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
